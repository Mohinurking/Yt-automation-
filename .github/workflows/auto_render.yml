name: Facebook Reels Cosmology Automation Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts requests

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Upload Generated Reel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-reel-output
          path: output/
pip install openai google-genai edge-tts requests
